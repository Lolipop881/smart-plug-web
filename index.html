<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f4f0"><title>ปลั๊ก Wi-Fi</title><link rel="stylesheet" href="extra.css"></head><body><section id="setup" hidden><h1>ปลั๊ก Wi-Fi</h1><form id="setup-form"><label>ลิงก์ Cloudflare Worker<input id="worker-url" type="url" required placeholder="https://smart-plug.ชื่อบัญชี.workers.dev" autocomplete="url"></label><label>รหัสผ่านควบคุม<input id="password" type="password" required autocomplete="current-password"></label><button id="connect" type="submit">เชื่อมต่อ</button><p id="setup-error" role="alert"></p></form></section><div id="simple-plug" class="viz-dotted-background">
<style>
#simple-plug{font-family:system-ui,sans-serif;padding:16px 6px;color-scheme:light dark}
#simple-plug *{box-sizing:border-box}
#simple-plug .app{max-width:440px;margin:auto;border-radius:28px;overflow:hidden;border:1px solid light-dark(#dfe4ec,#354050);background:light-dark(#f2f4f8,#141b27);color:light-dark(#182336,#edf2fa)}
#simple-plug .content{padding:24px 20px 14px}
#simple-plug header{display:flex;align-items:center;justify-content:space-between;gap:8px}
#simple-plug .brand{font-size:26px;font-weight:600;letter-spacing:-.8px}
#simple-plug .muted{font-size:12px;color:light-dark(#58677b,#a4b2c8)}
#simple-plug .online{font-size:12px;color:light-dark(#126c4a,#8cddb9);background:light-dark(#e1f1e9,#203c33);padding:7px 10px;border-radius:20px}
#simple-plug .demo{margin:12px 0 22px}
#simple-plug .section-title{font-size:16px;font-weight:600;margin:0 0 14px}
#simple-plug .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#simple-plug .tile{padding:16px 14px;border-radius:20px;background:light-dark(#fff,#222d3e);border:1px solid light-dark(#e4e8ef,#344255)}
#simple-plug .tile.active{background:light-dark(#e9f0ff,#233957);border-color:light-dark(#ccdafa,#38567d)}
#simple-plug .tile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
#simple-plug .icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:light-dark(#edf1f7,#344256);color:light-dark(#64738c,#bdcbe0)}
#simple-plug .active .icon{background:light-dark(#d6e4ff,#2f5079);color:light-dark(#205cbe,#acccff)}
#simple-plug button{font:500 13px system-ui;color:inherit;min-height:44px;border:0;border-radius:12px;padding:8px 12px;background:light-dark(#e8edf5,#344256)}
#simple-plug .power{width:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
#simple-plug .power[aria-pressed=true],#simple-plug .save{background:light-dark(#2871df,#82b5ff);color:light-dark(#fff,#132842)}
#simple-plug .name{font-size:15px;font-weight:600}
#simple-plug .state{font-size:13px;margin:5px 0 3px;color:light-dark(#59697e,#bbc8da)}
#simple-plug .active .state{color:light-dark(#205cbe,#acccff)}
#simple-plug .stamp{font-size:11px;color:light-dark(#64738a,#a7b7ce);min-height:15px}
#simple-plug .schedule-link{margin-top:12px;width:100%;background:transparent;border-top:1px solid light-dark(#e1e7f0,#415269);border-radius:0;display:flex;align-items:center;justify-content:space-between;gap:4px;text-align:left;font-size:12px;padding:8px 0 0}
#simple-plug .all{width:100%;margin-top:16px;background:light-dark(#fff,#222d3e);color:light-dark(#a24040,#ffb4b4);border:1px solid light-dark(#e4e8ef,#344255)}
#simple-plug .feedback{font-size:12px;color:light-dark(#58677b,#bac8da);margin-top:14px;min-height:18px;text-align:center}
#simple-plug .nav{display:flex;gap:8px;background:light-dark(#fff,#202b3b);border-top:1px solid light-dark(#e2e7ef,#364358);padding:10px 16px}
#simple-plug .nav button{flex:1;background:transparent;color:light-dark(#65748b,#aebdd1);display:flex;align-items:center;justify-content:center;gap:8px}
#simple-plug .nav button[aria-selected=true]{color:light-dark(#205cbe,#a7caff);background:light-dark(#edf3ff,#2a405e)}
#simple-plug .panel[hidden]{display:none}
#simple-plug .editor{padding:18px;background:light-dark(#fff,#222d3e);border-radius:20px}
#simple-plug label{display:block;font-size:13px;margin-bottom:12px}
#simple-plug input:not([type=checkbox]),#simple-plug select{display:block;width:100%;min-width:0;font:16px system-ui;padding:9px;margin-top:7px;min-height:44px;border:1px solid light-dark(#d5deeb,#50627a);border-radius:10px;background:light-dark(#f8faff,#182436);color:inherit}
#simple-plug .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#simple-plug .check{display:flex;align-items:center;gap:8px;min-height:44px;margin:6px 0}
#simple-plug .check input{width:18px;height:18px;accent-color:light-dark(#2871df,#82b5ff)}
#simple-plug .save{width:100%}
#simple-plug hr{border:0;border-top:1px solid light-dark(#e1e7f0,#415269);margin:22px 0}
#simple-plug .actions{display:flex;gap:8px;flex-wrap:wrap}
#simple-plug .timer-result{margin-top:12px;font-size:12px;color:light-dark(#58677b,#a4b2c8)}
#simple-plug button:disabled{opacity:.5}
@media(max-width:360px){#simple-plug .content{padding:20px 12px 12px}#simple-plug .tile{padding:14px 11px}#simple-plug .grid{gap:9px}#simple-plug .brand{font-size:23px}}
#simple-plug .app{border-radius:18px;background:light-dark(#f5f4f0,#1d211f);color:light-dark(#303832,#e2e7e2);border-color:light-dark(#e1e2da,#3b423d)}
#simple-plug .content{padding:28px 22px 18px}
#simple-plug .brand{font-size:24px;font-weight:500;letter-spacing:0}
#simple-plug .muted,#simple-plug .feedback{color:light-dark(#697269,#aab5ac)}
#simple-plug .online{padding:0;background:transparent;color:light-dark(#526d59,#a8c7af);font-size:12px}
#simple-plug .demo{margin:10px 0 30px}
#simple-plug .section-title{font-size:14px;font-weight:500;color:light-dark(#697269,#aab5ac);margin-bottom:14px}
#simple-plug .grid{gap:14px}
#simple-plug .tile,#simple-plug .tile.active{border-radius:12px;background:light-dark(#fffefa,#282e29);border:1px solid light-dark(#e5e6de,#3d473f);padding:18px 15px}
#simple-plug .tile-top{margin-bottom:22px}
#simple-plug .icon,#simple-plug .active .icon{background:transparent;color:light-dark(#717b70,#afbaad);border-radius:0;width:28px;height:36px;justify-content:flex-start}
#simple-plug .name{font-size:16px;font-weight:500}
#simple-plug .state,#simple-plug .active .state{color:light-dark(#657261,#afbdab);font-size:13px;margin-top:7px}
#simple-plug .stamp{margin-top:4px;color:light-dark(#737b72,#a6b1a5)}
#simple-plug button{background:light-dark(#eaece5,#3d473e);border-radius:8px;font-weight:400}
#simple-plug .power{width:48px;height:44px;background:transparent;position:relative;border-radius:0}
#simple-plug .power:before{content:'';width:44px;height:26px;border-radius:16px;background:light-dark(#dce0d7,#515b51);position:absolute;left:2px;top:9px}
#simple-plug .power:after{content:'';width:20px;height:20px;border-radius:50%;background:light-dark(#fffefa,#e9eee7);position:absolute;left:5px;top:12px}
#simple-plug .power[aria-pressed=true]{background:transparent;color:inherit}
#simple-plug .power[aria-pressed=true]:before{background:light-dark(#70876d,#829d7b)}
#simple-plug .power[aria-pressed=true]:after{left:23px}
#simple-plug .power svg,#simple-plug .power i{display:none}
#simple-plug .schedule-link{border-color:light-dark(#e9eae3,#424c43);color:light-dark(#657261,#afbdab);font-size:12px;margin-top:16px;background:transparent}
#simple-plug .all{background:transparent;color:light-dark(#6f5750,#c5b3a8);border-color:light-dark(#dedfd6,#485148);border-radius:8px;margin-top:22px}
#simple-plug .nav{padding:12px 22px;background:light-dark(#fffefa,#282e29);border-color:light-dark(#e5e6de,#3d473f)}
#simple-plug .nav button,#simple-plug .nav button[aria-selected=true]{background:transparent;border-radius:0;color:light-dark(#778073,#a8b1a4)}
#simple-plug .nav button[aria-selected=true]{color:light-dark(#354c37,#d1dec9);font-weight:500}
#simple-plug .editor{border-radius:12px;background:light-dark(#fffefa,#282e29);border:1px solid light-dark(#e5e6de,#3d473f)}
#simple-plug input:not([type=checkbox]),#simple-plug select{border-radius:7px;background:light-dark(#f9faf5,#202721);border-color:light-dark(#dce0d5,#4b584a)}
#simple-plug .check input{accent-color:light-dark(#70876d,#829d7b)}
#simple-plug .save{background:light-dark(#596d55,#a9bda0);color:light-dark(#fffefa,#202721);border-radius:8px}
#simple-plug hr{border-color:light-dark(#e1e5da,#485147)}
#simple-plug .timer-result{color:light-dark(#697269,#aab5ac)}
@media(max-width:360px){#simple-plug .content{padding:22px 14px 14px}#simple-plug .tile{padding:16px 12px}#simple-plug .grid{gap:10px}}
#simple-plug .content{padding-top:20px}
#simple-plug .heading{font-size:14px;color:light-dark(#697269,#aab5ac);margin-bottom:20px}
#simple-plug .name-edit{display:block;padding:0;background:transparent;text-align:left;min-height:44px;width:100%;font-size:16px;overflow-wrap:anywhere}
#simple-plug .emoji-edit{font-size:26px;padding:0;background:transparent;min-width:44px;text-align:left}
#simple-plug .stamp{font-size:12px;line-height:1.6;min-height:38px;white-space:pre-line;overflow-wrap:anywhere}
#simple-plug .name-edit:hover{ text-decoration:underline }
#simple-plug .emoji-choices{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
#simple-plug .emoji-choices button{font-size:22px;min-width:44px;background:transparent}
#simple-plug .identity{margin-bottom:22px}
#simple-plug .save,#simple-plug .countdown button[type=submit]{background:light-dark(#218346,#68cb8a);color:light-dark(#ffffff,#143322);font-weight:500;border:1px solid transparent;min-height:46px}
#simple-plug .save:hover,#simple-plug .countdown button[type=submit]:hover{background:light-dark(#186b37,#83dda2)}
#simple-plug .success{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 14px;background:light-dark(#e5f4e8,#233e2c);color:light-dark(#216638,#b5eac4);border-radius:8px;font-size:13px}
#simple-plug .success[hidden]{display:none}
#simple-plug .success button{background:transparent;color:inherit;min-width:44px;padding:4px;font-size:18px}
#simple-plug .app{position:relative}
#simple-plug .stamp{display:none}
#simple-plug .success{position:absolute;left:18px;right:18px;bottom:78px;margin:0;justify-content:center;box-shadow:0 4px 18px light-dark(#26382d1f,#00000040);pointer-events:none}

#simple-plug .schedule-text{white-space:pre-line;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;line-height:1.6}
#simple-plug .timer-result{white-space:pre-line;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.6;margin-top:14px}
</style>
<section hidden class="app" aria-label="หน้าเว็บควบคุมสไตล์ Smart Home">
<div class="content">
<div class="top-status"><span class="connection">กำลังเชื่อมต่อ</span><button id="logout" type="button">ออกจากระบบ</button></div>
<div id="simple-devices-panel" class="panel" role="tabpanel" aria-labelledby="simple-devices-tab">
<div class="grid"></div>
<button type="button" class="all cursor-interaction">ปิดทั้งหมด</button>
</div>
<div id="simple-schedule-panel" class="panel" role="tabpanel" aria-labelledby="simple-schedule-tab" hidden>
<div class="section-title">ตั้งค่าช่อง</div>
<div class="editor">
<label>เลือกช่อง<select class="channel"><option value="0">ช่อง 1</option><option value="1">ช่อง 2</option><option value="2">ช่อง 3</option><option value="3">ช่อง 4</option></select></label>
<form class="identity"><label>ชื่อช่อง<input class="channel-name" type="text" maxlength="32" required></label><label>อีโมจิ<input class="channel-emoji" type="text" maxlength="16" required></label><div class="emoji-choices" aria-label="เลือกอีโมจิ"><button type="button" class="cursor-interaction" data-emoji="💡" aria-label="หลอดไฟ">💡</button><button type="button" class="cursor-interaction" data-emoji="🔌" aria-label="ปลั๊ก">🔌</button><button type="button" class="cursor-interaction" data-emoji="🌀" aria-label="พัดลม">🌀</button><button type="button" class="cursor-interaction" data-emoji="🐟" aria-label="ปลา">🐟</button><button type="button" class="cursor-interaction" data-emoji="🌿" aria-label="ต้นไม้">🌿</button><button type="button" class="cursor-interaction" data-emoji="🏠" aria-label="บ้าน">🏠</button></div><button type="submit" class="save cursor-interaction">บันทึกชื่อและอีโมจิ</button></form>
<form class="daily"><label class="check"><input type="checkbox" class="enabled"> เปิดใช้ตารางทุกวัน</label><div class="pair"><label>เวลาเปิด<input class="open-time" type="time" value="08:00" required></label><label>เวลาปิด<input class="close-time" type="time" value="18:00" required></label></div><div class="muted" style="margin-bottom:12px">เวลาไทย · UTC+7</div><div class="actions"><button type="submit" class="save cursor-interaction">บันทึกตารางเวลา</button><button type="button" class="clear-daily cursor-interaction">ล้างตารางเวลา</button></div></form>
<hr><div class="section-title">นับถอยหลัง</div>
<form class="countdown"><div class="pair"><label>อีกกี่นาที<input type="number" class="minutes" value="30" min="1" max="10080" step="1" required></label><label>คำสั่ง<select class="action"><option value="off">ปิด</option><option value="on">เปิด</option></select></label></div><div class="actions"><button type="submit" class="cursor-interaction">เริ่มนับถอยหลัง</button><button type="button" class="cancel cursor-interaction" hidden>ยกเลิก</button></div><div class="timer-result"></div></form>
</div>
</div>
<div class="success" role="status" hidden><span class="success-text"></span></div>
<div class="feedback" aria-live="polite"></div>
</div>
<nav class="nav" role="tablist" aria-label="เมนูหลัก"><button id="simple-devices-tab" type="button" class="cursor-interaction" role="tab" aria-selected="true" aria-controls="simple-devices-panel" data-page="devices">บ้าน</button><button id="simple-schedule-tab" type="button" class="cursor-interaction" role="tab" aria-selected="false" aria-controls="simple-schedule-panel" data-page="schedule">ตั้งเวลา</button></nav>
</section>

</div>
<script type="module" src="app-open.js"></script></body></html>

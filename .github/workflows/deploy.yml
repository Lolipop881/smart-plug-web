name: Deploy Smart Plug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-plug-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
      DEVICE_KEY: ${{ secrets.DEVICE_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        run: |
          node -e 'for (const k of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","WEB_PASSWORD","DEVICE_KEY","SESSION_SECRET"]) { if (!process.env[k]) { console.error("Missing secret: " + k); process.exit(1); } }'

      - name: Prepare current website sources
        run: |
          mkdir -p deploy/smart-plug-cloud/src deploy/smart-plug-cloud/public deploy/smart-plug-cloud/tests
          cp src/*.js deploy/smart-plug-cloud/src/
          cp app.js index.html extra.css deploy/smart-plug-cloud/public/
          cp package.json wrangler.jsonc deploy/smart-plug-cloud/
          cp hub.test.mjs access.test.mjs deploy/smart-plug-cloud/tests/

      - name: Install and test
        working-directory: deploy/smart-plug-cloud
        run: |
          npm install
          npm test

      - name: Prepare Worker secrets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const values = {};
          for (const key of ['WEB_PASSWORD', 'DEVICE_KEY', 'SESSION_SECRET']) {
            values[key] = process.env[key];
          }
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'worker-secrets.json'),
            JSON.stringify(values),
            { mode: 0o600 }
          );
          NODE

      - name: Inspect active deployment
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/smart-plug-web';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const r=await fetch(base+'/deployments',{headers});
          const d=await r.json();
          const deployments=d.result?.deployments || [];
          console.log('Recent deployments:',JSON.stringify(deployments.slice(0,4).map(x=>({id:x.id,source:x.source,created_on:x.created_on,versions:x.versions,annotations:x.annotations}))));
          for(const x of deployments.slice(0,3))for(const v of x.versions||[]){
            const r=await fetch(base+'/versions/'+v.version_id,{headers});
            const d=await r.json();
            console.log('Version metadata:',JSON.stringify({id:d.result?.id,metadata:{created_on:d.result?.metadata?.created_on,source:d.result?.metadata?.source},annotations:d.result?.annotations}));
          }
          NODE

      - name: Set Worker secrets
        working-directory: deploy/smart-plug-cloud
        run: npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"

      - name: Deploy website
        working-directory: deploy/smart-plug-cloud
        run: npx wrangler deploy

      - name: Verify deployed dashboard
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://smart-plug-web.lumira-labassistant.workers.dev';
          let verified = false;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch(origin + '/api/access', {signal: AbortSignal.timeout(10000)});
              const access = await response.json();
              const page = await fetch(origin + '/', {signal: AbortSignal.timeout(10000)});
              const html = await page.text();
              if (response.ok && access.publicControl === true && access.version === 'waiting-board-v1' && html.includes('รอบอร์ดเชื่อมต่อ') && html.includes('serverOrigin=location.origin')) {
                const state = await fetch(origin + '/api/state', {signal: AbortSignal.timeout(10000)});
                if (!state.ok) throw Error('State API: ' + state.status);
                console.log('Verified login-free dashboard and board state API');
                verified = true;
                break;
              }
              console.log('Waiting for latest deployment; access status:', response.status, 'version:', access.version || 'older version');
            } catch (error) { console.log('Verification retry:', error.message); }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!verified) {
            const url = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/workers/scripts/smart-plug-web/deployments';
            const response = await fetch(url, {headers: {Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN}});
            const data = await response.json();
            console.log('Active Worker deployments:', JSON.stringify(data.result));
            throw Error('Public website is not serving the expected deployment');
          }
          NODE

      - name: Remove temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
